[pytest]
# Конфігурація pytest

# Мінімальна версія Python
minversion = 7.0

# Шляхи до тестів
testpaths = tests

# Патерни для пошуку тестів
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Показувати додаткову інформацію
addopts = 
	-v
	--strict-markers
	--tb=short
	--disable-warnings

# Markers для організації тестів
markers =
	unit: Unit тести
	integration: Інтеграційні тести
	slow: Повільні тести
